openapi: 3.1.0
info:
  title: Mental Wellness Platform — Wellness API
  version: 1.5.0-draft.1
  summary: Public API — consent, voice sessions, recordings, audio-processing jobs, ASHA assessment cases, clinician review, programme support contacts and partner referrals.
  description: |
    Public API of the wellness backend (a Spring Boot modular monolith, Java 21) used by the
    React Native app and, later, the clinician web app.

    **Status: DRAFT (pre-release).** The consent model was approved for implementation with
    synthetic data on 2026-10-18; privacy/legal review is pending before any real participant
    data. See docs/privacy/consent-and-data-lifecycle.md.

    **Clinical safety:** No operation in this API returns a diagnosis, risk score or model
    prediction. Processing jobs report technical status and audio quality only. Case operations
    store coded answers as entered; no score is computed. The only questionnaire in 1.1 is
    illustrative and NOT VALIDATED, so case operations accept SYNTHETIC data only.

    **Direct identifiers** (name, village) are never part of this API. They are written once,
    write-only, through `identity-api.v1.yaml` and stored only in the identity database (ADR-010).

    ## Cross-cutting rules
    - **Authentication:** OIDC bearer access tokens (authorization code + PKCE for the mobile app).
      Every operation requires a token, and there are no anonymous endpoints.
    - **Authorization:** role claims (`ASHA_WORKER`, `CLINICIAN`, `ADMIN`) plus record-level
      assignment checks. An ASHA worker may only act on participants assigned to them.
      `RESEARCHER` has no access to this API. Research data is delivered only through the
      consent-filtered research export.
    - **Correlation:** clients send `X-Correlation-ID` (UUID). The server generates one if it is
      absent and echoes it in every response and problem body.
    - **Idempotency:** every create operation takes a client-generated resource ID and an
      `Idempotency-Key`. Repeating a request with the same key and the same body returns the
      original result. The same key with a different body returns `409 IDEMPOTENCY_CONFLICT`.
      Keys are scoped to (authenticated principal, operation). Authorization runs **before** a
      replay is answered, so a replayed key never returns a resource the caller can't access.
      Keys are retained for at least 30 days so offline devices can retry safely.
    - **Errors:** `application/problem+json` (RFC 9457). Problem bodies never contain participant
      data, audio, stack traces or internal hostnames.
    - **Audit:** operations list the audit events they emit in `x-audit-events`. Audit records
      store actor pseudonym, role, action, resource ID, outcome, access-reason code, correlation
      ID and timestamp, never request bodies.
    - **ADMIN access:** every operation on participant-linked data accepts `X-Access-Reason`. The
      server **requires** it (400 `VALIDATION_FAILED` if missing) when the caller has only the
      ADMIN role for that participant, and it is recorded in the audit event.
    - **Consent is checked per consent event:** the referenced `consent_event_id` must belong to
      the participant, and the required scopes must be in effect **on that event** (a newer
      consent event never revives an older, withdrawn one). Capture timestamps must not be
      earlier than the event's `captured_at_utc`, and must not be later than any withdrawal of a
      required scope recorded for that event.
    - **Assignment (v1):** a `participant_ref` is assigned to the ASHA worker who records its
      first consent event. Cases follow their participant's assignment. Reassignment is an ADMIN
      operation (not yet specified).
    - **Consent:** operations list their consent prerequisites in `x-consent-prerequisite`. The
      server enforces them and the client check is only a convenience.
  contact:
    name: Platform architecture (solution-architect)
servers:
  - url: http://localhost:8080
    description: Local development (Docker Compose) only. Every other environment uses HTTPS (TLS 1.2+).
security:
  - oidc: []
tags:
  - name: consent
    description: Consent events, withdrawals and effective consent status.
  - name: voice-sessions
    description: Voice session creation and recording metadata/content submission.
  - name: processing
    description: Audio-processing job submission and status.
  - name: cases
    description: |
      ASHA assessment visits (1.1, promoted from wellness-api-provisional.v0.yaml). A case holds
      coded answers only: age band, gender, health and lifestyle observations, questionnaire
      answers and the worker's follow-up decision. No free text (consent-and-data-lifecycle.md §8).
  - name: care-team
    description: |
      Facilities, staff memberships and each participant's care team (1.4, ADR-016). The ASHA worker
      keeps their own link; facility staff (CLINICIAN, COUNSELLOR, HEALTH_STAFF) reach a participant
      only through an active membership at a facility on that participant's care team.
  - name: encounters
    description: |
      Clinic visits, tele-consultations and counselling sessions by facility staff (1.5, ADR-016),
      under CLINICAL_CARE consent. Instrument scores follow each instrument's published rule and are
      **never a diagnosis**; diagnoses are entered by clinicians only; notes are encrypted and off by
      default. HEALTH_STAFF never see scores, notes or diagnoses. Nothing here is exported to research.
  - name: programme
    description: Programme reference data with no participant data, such as verified support contacts (ADR-015).
  - name: referrals
    description: |
      Pseudonymous referrals to partner programmes (1.3, ADR-015). Only SIMULATED partners exist:
      no real Tele-MANAS, eSanjeevani, ABDM or HMIS connection is configured or claimed. A clinician
      sends each referral explicitly; it carries a handoff code, never a name or contact detail.
  - name: review
    description: |
      Clinician review of flagged cases (1.2, ADR-014; promoted from the provisional
      screening-review outline). Pseudonymous, coded decisions only. The decision goes back to the
      ASHA worker through the case's `review` field; clinicians never see names or villages.

paths:
  /v1/consent-events:
    post:
      tags: [consent]
      operationId: createConsentEvent
      summary: Record a consent event
      description: |
        Records an informed-consent event captured by an ASHA worker, which may be created offline
        and synced later. Consent events are immutable once accepted; changes are made through
        withdrawals or a new consent event. The capturing worker is taken from the access token,
        not the request body.
      security:
        - oidc: [consent:write]
      x-roles: [ASHA_WORKER, CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-data-access: ASHA worker, assigned to participant_ref (assigned by this event if new); or facility staff at facility_code (see facility_code).
      x-consent-prerequisite: none (this operation creates consent)
      x-audit-events: [CONSENT_EVENT_CREATED, CONSENT_EVENT_REJECTED]
      x-idempotency: consent_event_id plus Idempotency-Key; replay returns 200 with the stored event.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentEventCreate'
            examples:
              kannadaWitnessed:
                $ref: '#/components/examples/ConsentEventCreateExample'
      responses:
        '201':
          description: Consent event recorded.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentEvent' }
              examples:
                created: { $ref: '#/components/examples/ConsentEventExample' }
        '200':
          description: Idempotent replay; the stored event is returned unchanged.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/consent-events/{consentEventId}:
    get:
      tags: [consent]
      operationId: getConsentEvent
      summary: Retrieve a consent event
      security:
        - oidc: [consent:read]
      x-roles: [ASHA_WORKER, CLINICIAN, COUNSELLOR, HEALTH_STAFF, ADMIN]
      x-data-access: ASHA_WORKER for assigned participants; facility staff for participants on their care team; ADMIN with a reason code.
      x-consent-prerequisite: none
      x-audit-events: [CONSENT_EVENT_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ConsentEventId'
        - $ref: '#/components/parameters/AccessReason'
      responses:
        '200':
          description: The consent event with its current status.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentEvent' }
              examples:
                active: { $ref: '#/components/examples/ConsentEventExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/consent-events/{consentEventId}/withdrawals:
    post:
      tags: [consent]
      operationId: withdrawConsent
      summary: Withdraw some or all consent scopes
      description: |
        Records a withdrawal (append-only) against a consent event. Withdrawal takes effect for
        new operations as soon as it is accepted. Downstream effects (cancelling queued processing
        jobs, excluding records from future research exports, deleting retained audio) are applied
        asynchronously and reported in `downstream_actions`. Already-derived data is handled as
        described in docs/privacy/consent-and-data-lifecycle.md; that policy needs stakeholder approval.
        A withdrawal can never be rejected because of outstanding processing work.
      security:
        - oidc: [consent:write]
      x-roles: [ASHA_WORKER, CLINICIAN, COUNSELLOR, HEALTH_STAFF, ADMIN]
      x-data-access: ASHA_WORKER for assigned participants; facility staff for participants on their care team; ADMIN with a reason code.
      x-consent-prerequisite: Consent event exists. Withdrawing an already-withdrawn scope is a no-op that returns 200.
      x-audit-events: [CONSENT_WITHDRAWN, CONSENT_DOWNSTREAM_ACTION_SCHEDULED]
      x-idempotency: withdrawal_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsentEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentWithdrawalCreate' }
            examples:
              withdrawResearch: { $ref: '#/components/examples/ConsentWithdrawalCreateExample' }
      responses:
        '202':
          description: Withdrawal recorded; downstream actions scheduled.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentWithdrawal' }
              examples:
                accepted: { $ref: '#/components/examples/ConsentWithdrawalExample' }
        '200':
          description: Idempotent replay, or a no-op because the scopes were already withdrawn.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentWithdrawal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/participants/{participantRef}/consent-status:
    get:
      tags: [consent]
      operationId: getConsentStatus
      summary: Effective consent status for a participant
      description: Returns the scopes currently in effect, combining all consent events and withdrawals. The mobile app uses this to enable or disable capture after sync.
      security:
        - oidc: [consent:read]
      x-roles: [ASHA_WORKER, CLINICIAN, COUNSELLOR, HEALTH_STAFF, ADMIN]
      x-data-access: ASHA_WORKER for assigned participants; facility staff for participants on their care team.
      x-consent-prerequisite: none
      x-audit-events: [CONSENT_STATUS_READ]
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ParticipantRef'
      responses:
        '200':
          description: Effective consent status.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatus' }
              examples:
                partiallyWithdrawn: { $ref: '#/components/examples/ConsentStatusExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/voice-sessions:
    post:
      tags: [voice-sessions]
      operationId: createVoiceSession
      summary: Create a voice session
      description: Creates a voice capture session for a consented participant. Sessions may be created offline and synced; `captured_at_utc` is the device time.
      security:
        - oidc: [voice:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must be assigned to participant_ref.
      x-consent-prerequisite: consent_event_id must belong to participant_ref, SCREENING_PARTICIPATION and AUDIO_RECORDING must be in effect on that event when the server processes the request, and captured_at_utc must not be before the event's capture time or after a withdrawal of either scope. Otherwise 422 CONSENT_NOT_ACTIVE or CONSENT_PARTICIPANT_MISMATCH.
      x-audit-events: [VOICE_SESSION_CREATED, VOICE_SESSION_REJECTED_CONSENT]
      x-idempotency: session_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceSessionCreate' }
            examples:
              syntheticSession: { $ref: '#/components/examples/VoiceSessionCreateExample' }
      responses:
        '201':
          description: Session created.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceSession' }
              examples:
                created: { $ref: '#/components/examples/VoiceSessionExample' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/voice-sessions/{sessionId}:
    get:
      tags: [voice-sessions]
      operationId: getVoiceSession
      summary: Retrieve a voice session and its recordings' status
      description: Returns session metadata and recording/processing status. Never returns audio, feature values or any model output.
      security:
        - oidc: [voice:read]
      x-roles: [ASHA_WORKER, CLINICIAN, ADMIN]
      x-data-access: ASHA_WORKER and CLINICIAN only for assigned participants.
      x-consent-prerequisite: none for metadata. Sessions with fully withdrawn consent return status CANCELLED.
      x-audit-events: [VOICE_SESSION_READ]
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceSession' }
              examples:
                processed: { $ref: '#/components/examples/VoiceSessionExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/voice-sessions/{sessionId}/recordings:
    post:
      tags: [voice-sessions]
      operationId: submitRecordingMetadata
      summary: Submit recording metadata
      description: Registers a recording and its expected checksum before content upload. The response gives the upload path.
      security:
        - oidc: [voice:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must own the session (created it or is assigned to its participant).
      x-consent-prerequisite: AUDIO_RECORDING in effect on the session's consent event, and recorded_at_utc not after a withdrawal of it.
      x-audit-events: [RECORDING_REGISTERED]
      x-idempotency: recording_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingCreate' }
            examples:
              wav16k: { $ref: '#/components/examples/RecordingCreateExample' }
      responses:
        '201':
          description: Recording registered; awaiting content.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
              examples:
                awaiting: { $ref: '#/components/examples/RecordingExample' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/voice-sessions/{sessionId}/recordings/{recordingId}/content:
    put:
      tags: [voice-sessions]
      operationId: uploadRecordingContent
      summary: Upload recording audio
      description: |
        Uploads the audio for a registered recording in a single request (maximum 25 MB in v1). The
        server **computes** the SHA-256 and byte length of the received body itself, and rejects the
        upload (422 CHECKSUM_MISMATCH) unless both match the registered `sha256` and `size_bytes`
        and the `X-Content-SHA256` header. It then stores the audio in
        encrypted object storage. Audio is never written to logs. Re-uploading identical content is
        idempotent, and different content for an already-uploaded recording returns 409.
        Resumable or chunked upload is deferred (see vertical-slice-plan.md).
      security:
        - oidc: [voice:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must own the session.
      x-consent-prerequisite: AUDIO_RECORDING in effect, re-checked at upload time. Withdrawn returns 422 CONSENT_NOT_ACTIVE and the bytes are discarded.
      x-audit-events: [RECORDING_CONTENT_STORED, RECORDING_CONTENT_REJECTED]
      x-idempotency: Natural, keyed on recordingId and checksum.
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RecordingId'
        - name: X-Content-SHA256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the request body.
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          audio/wav:
            schema: { type: string, contentMediaType: audio/wav }
          audio/flac:
            schema: { type: string, contentMediaType: audio/flac }
      responses:
        '200':
          description: Content stored (or identical content already stored).
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/processing-jobs:
    post:
      tags: [processing]
      operationId: submitProcessingJob
      summary: Submit an audio-processing job
      description: |
        Queues openSMILE feature extraction for an uploaded recording. Processing is asynchronous,
        so poll `getProcessingJob` for the result. Submitting the same recording and pipeline
        profile again returns the existing job.
      security:
        - oidc: [processing:write]
      x-roles: [ASHA_WORKER, ADMIN]
      x-data-access: ASHA_WORKER must own the session. ADMIN with reason code, for example to process an existing recording under a newer pipeline profile. The same recording and profile always return the existing job.
      x-consent-prerequisite: AUDIO_RECORDING in effect at submission. Re-checked by the server before the worker is given the audio. Withdrawal cancels queued jobs.
      x-audit-events: [PROCESSING_JOB_SUBMITTED]
      x-idempotency: (recording_id, pipeline_profile) is unique; replay returns 200 with the existing job.
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessingJobCreate' }
            examples:
              egemaps: { $ref: '#/components/examples/ProcessingJobCreateExample' }
      responses:
        '202':
          description: Job queued.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJob' }
              examples:
                queued: { $ref: '#/components/examples/ProcessingJobQueuedExample' }
        '200':
          description: Existing job for this recording and profile.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/processing-jobs/{jobId}:
    get:
      tags: [processing]
      operationId: getProcessingJob
      summary: Retrieve processing job status
      description: |
        Returns job status and the audio-quality outcome. Feature values are **not** returned: they
        aren't meaningful to ASHA workers or clinicians, and they are not a screening result. The
        response sets `Retry-After` while the job is QUEUED or RUNNING.
      security:
        - oidc: [processing:read]
      x-roles: [ASHA_WORKER, CLINICIAN, ADMIN]
      x-data-access: ASHA_WORKER and CLINICIAN only for assigned participants.
      x-consent-prerequisite: none (status only).
      x-audit-events: [PROCESSING_JOB_READ]
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current job status.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Retry-After:
              description: Suggested polling delay in seconds while the job is not terminal.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJob' }
              examples:
                succeeded: { $ref: '#/components/examples/ProcessingJobSucceededExample' }
                failedQuality: { $ref: '#/components/examples/ProcessingJobFailedExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/cases:
    post:
      tags: [cases]
      operationId: createCase
      summary: Open an assessment case for a consented participant
      description: |
        Opens a case after consent has been recorded (the client records the consent event first,
        then the case, then the identity record through identity-api.v1.yaml). Holds coded,
        non-identifying registration answers only.
      security:
        - oidc: [cases:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must be assigned to participant_ref.
      x-consent-prerequisite: consent_event_id must belong to participant_ref, SCREENING_PARTICIPATION must be in effect on that event, and opened_at_utc must not be before the event's capture time. Otherwise 422 CONSENT_NOT_ACTIVE or CONSENT_PARTICIPANT_MISMATCH. age_band AGE_UNDER_18 returns 422 ADULT_CONFIRMATION_REQUIRED (minors need an approved child pathway).
      x-audit-events: [CASE_CREATED, CASE_REJECTED]
      x-idempotency: case_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseCreate' }
            examples:
              synthetic: { $ref: '#/components/examples/CaseCreateExample' }
      responses:
        '201':
          description: Case opened.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
              examples:
                opened: { $ref: '#/components/examples/CaseOpenExample' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [cases]
      operationId: listMyCases
      summary: List the caller's cases
      description: Cases opened by the calling ASHA worker, newest first. Backs the "My households" and "Follow-ups" screens. Pseudonymous view only.
      security:
        - oidc: [cases:read]
      x-roles: [ASHA_WORKER]
      x-data-access: Only cases the caller opened.
      x-consent-prerequisite: none
      x-audit-events: [CASE_LIST_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: follow_up
          in: query
          required: false
          description: When true, only cases needing human follow-up (follow_up_requested or urgent_review_flag).
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The caller's cases.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/cases/{caseId}:
    get:
      tags: [cases]
      operationId: getCase
      summary: Retrieve a case (pseudonymous view)
      description: Returns the case without direct identifiers. Identity is never returned by this API.
      security:
        - oidc: [cases:read]
      x-roles: [ASHA_WORKER, ADMIN]
      x-data-access: ASHA_WORKER only for assigned participants. ADMIN with reason code.
      x-consent-prerequisite: none
      x-audit-events: [CASE_READ]
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
              examples:
                completed: { $ref: '#/components/examples/CaseCompletedExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/cases/{caseId}/observations:
    post:
      tags: [cases]
      operationId: submitObservations
      summary: Submit coded health and lifestyle observations
      description: |
        One observation set per case, using the coded catalogue `asha-observations` 0.1.0. Free-text
        notes are excluded until a policy on sensitive free text is agreed.
      security:
        - oidc: [cases:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must be assigned to the case's participant.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on the case's consent event. The case must be OPEN.
      x-audit-events: [OBSERVATIONS_SUBMITTED, CASE_REJECTED]
      x-idempotency: observation_set_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationSetCreate' }
            examples:
              synthetic: { $ref: '#/components/examples/ObservationSetCreateExample' }
      responses:
        '201':
          description: Recorded.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/cases/{caseId}/questionnaire-responses:
    post:
      tags: [cases]
      operationId: submitQuestionnaireResponse
      summary: Submit questionnaire answers
      description: |
        One response per case. The only instrument in 1.1 is `illustrative-wellness` 0.1.0, which is
        NOT VALIDATED and not licensed for screening: it exists to exercise the software with
        SYNTHETIC data. Answers are stored as coded values and never scored. A SELF_HARM_THOUGHTS
        answer of SOMETIMES or OFTEN sets `urgent_review_flag` so a trained person follows up; the
        flag is a prompt for human action, not a risk assessment.
      security:
        - oidc: [cases:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must be assigned to the case's participant.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on the case's consent event. The case must be OPEN.
      x-audit-events: [QUESTIONNAIRE_SUBMITTED, URGENT_REVIEW_FLAG_RAISED, CASE_REJECTED]
      x-idempotency: response_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionnaireResponseCreate' }
            examples:
              synthetic: { $ref: '#/components/examples/QuestionnaireResponseCreateExample' }
      responses:
        '201':
          description: Recorded.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/cases/{caseId}/completion:
    post:
      tags: [cases]
      operationId: completeCase
      summary: Complete the visit and record the follow-up decision
      description: Closes data entry for the case. Requires the questionnaire response (the safety question must have been asked). A completed case accepts no further submissions (409 RESOURCE_CONFLICT).
      security:
        - oidc: [cases:write]
      x-roles: [ASHA_WORKER]
      x-data-access: Caller must be assigned to the case's participant.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on the case's consent event.
      x-audit-events: [CASE_COMPLETED, CASE_REJECTED]
      x-idempotency: Idempotency-Key; replay returns 200 with the completed case.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseCompletion' }
      responses:
        '201':
          description: Case completed.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
              examples:
                completed: { $ref: '#/components/examples/CaseCompletedExample' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/review-queue:
    get:
      tags: [review]
      operationId: listReviewQueue
      summary: Cases waiting for (or given) clinician review
      description: |
        Pseudonymous queue of cases that need a trained person to follow up: an urgent-review flag
        from the safety question, or a follow-up request from the ASHA worker. Urgent cases come
        first, then the oldest. Cases whose participant has withdrawn SCREENING_PARTICIPATION are
        left out. No names, places or scores; identity stays write-only (ADR-014).
      security:
        - oidc: [review:read]
      x-roles: [CLINICIAN]
      x-data-access: Every clinician sees every eligible case in the programme (v1.2; teams and areas are not modelled yet). Each read is audited.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on each case's consent event; others are excluded.
      x-audit-events: [REVIEW_QUEUE_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [AWAITING_REVIEW, REVIEWED, ALL], default: AWAITING_REVIEW }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The queue.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/review-queue/{caseId}:
    get:
      tags: [review]
      operationId: getReviewCase
      summary: A queued case with its coded answers and review history
      description: The answers exactly as recorded (codes, never scored), the observations and every review so far. Cases that are not eligible for review, or whose consent was withdrawn, return 404.
      security:
        - oidc: [review:read]
      x-roles: [CLINICIAN]
      x-data-access: Eligible cases only. Audited.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on the case's consent event.
      x-audit-events: [REVIEW_CASE_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case for review.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/review-queue/{caseId}/reviews:
    post:
      tags: [review]
      operationId: submitClinicianReview
      summary: Record a clinician's decision
      description: |
        Appends a coded decision (append-only: a later review supersedes, never edits, an earlier
        one). No free text. The decision is a human judgement; the platform never suggests one. It
        appears on the case for the ASHA worker, who contacts the person.
        Decision and timeframe must agree: NO_FURTHER_ACTION → NONE; MONITOR → WITHIN_7_DAYS or
        WITHIN_30_DAYS; REFER → WITHIN_24_HOURS, WITHIN_7_DAYS or WITHIN_30_DAYS; URGENT_REFER →
        WITHIN_24_HOURS. Otherwise 400.
      security:
        - oidc: [review:write]
      x-roles: [CLINICIAN]
      x-data-access: Eligible cases only.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on the case's consent event (otherwise 404, as the case leaves the queue).
      x-audit-events: [CLINICIAN_REVIEW_RECORDED]
      x-idempotency: review_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicianReviewCreate' }
            examples:
              refer: { $ref: '#/components/examples/ClinicianReviewCreateExample' }
      responses:
        '201':
          description: Recorded.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicianReview' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicianReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/programme/support-contacts:
    get:
      tags: [programme]
      operationId: listSupportContacts
      summary: Helplines and support contacts for urgent situations
      description: |
        Programme configuration, shown with urgent-review alerts (for example Tele-MANAS, 14416).
        The clinical lead must verify each contact for the programme area; `verified: false`
        contacts must be shown labelled as pending verification. Calling a number is the worker's
        action, and no data is sent to the contact.
      security:
        - oidc: [cases:read]
        - oidc: [review:read]
      x-roles: [ASHA_WORKER, CLINICIAN]
      x-data-access: No participant data.
      x-consent-prerequisite: none (no participant data)
      x-audit-events: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The contacts, in configuration order.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportContactList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/integration/partners:
    get:
      tags: [referrals]
      operationId: listReferralPartners
      summary: Partner programmes that can receive referrals here
      description: Enabled partners only. `mode` is SIMULATED for every partner in this release.
      security:
        - oidc: [review:read]
      x-roles: [CLINICIAN]
      x-data-access: No participant data.
      x-consent-prerequisite: none (no participant data)
      x-audit-events: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Partners.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/review-queue/{caseId}/referrals:
    post:
      tags: [referrals]
      operationId: createReferral
      summary: Send a referral to a partner programme
      description: |
        The clinician's explicit action; nothing is sent automatically. The case's latest review
        (`review_id`) must be REFER or URGENT_REFER (otherwise 409), the participant must have
        EXTERNAL_REFERRAL_SHARING in effect (otherwise 422 CONSENT_NOT_ACTIVE), and the partner must
        be enabled (otherwise 422 PARTNER_NOT_ENABLED). One live referral per case and partner. The
        referral is queued in an outbox and delivered asynchronously
        (contracts/integration/referral-bundle.schema.json). The ASHA worker quotes the
        `handoff_code` when connecting the person to the partner.
      security:
        - oidc: [review:write]
      x-roles: [CLINICIAN]
      x-data-access: Cases eligible for review only.
      x-consent-prerequisite: SCREENING_PARTICIPATION and EXTERNAL_REFERRAL_SHARING in effect on the case's consent event.
      x-audit-events: [REFERRAL_CREATED, REFERRAL_REJECTED, REFERRAL_DELIVERED, REFERRAL_DELIVERY_FAILED]
      x-idempotency: referral_id plus Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralCreate' }
      responses:
        '201':
          description: Referral queued.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
              examples:
                queued: { $ref: '#/components/examples/ReferralExample' }
        '200':
          description: Idempotent replay.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/cases/{caseId}/referrals:
    get:
      tags: [referrals]
      operationId: listCaseReferrals
      summary: Referrals of a case and their partner status
      description: For the assigned ASHA worker (who connects the person, quoting the handoff code) and for clinicians while the case is eligible for review.
      security:
        - oidc: [cases:read]
        - oidc: [review:read]
      x-roles: [ASHA_WORKER, CLINICIAN]
      x-data-access: ASHA_WORKER for assigned participants; CLINICIAN for cases eligible for review.
      x-consent-prerequisite: none (status of referrals already made)
      x-audit-events: [REFERRAL_LIST_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Referrals, oldest first.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/facilities/{facilityCode}:
    put:
      tags: [care-team]
      operationId: putFacility
      summary: Create or update a facility
      security:
        - oidc: [careteam:admin]
      x-roles: [ADMIN]
      x-data-access: No participant data. X-Access-Reason is always required here (400 without it); audited with the reason code.
      x-consent-prerequisite: none (no participant data)
      x-audit-events: [FACILITY_UPSERTED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/FacilityCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacilityPut' }
      responses:
        '200':
          description: The facility.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/facilities/{facilityCode}/memberships/{subject}:
    put:
      tags: [care-team]
      operationId: putStaffMembership
      summary: Add, change or deactivate a staff member's role at a facility
      description: '`subject` is the staff member''s identity-provider subject (pseudonymous). The role must also be one of their realm roles to take effect.'
      security:
        - oidc: [careteam:admin]
      x-roles: [ADMIN]
      x-data-access: No participant data. X-Access-Reason is always required here (400 without it); audited with the reason code.
      x-consent-prerequisite: none (no participant data)
      x-audit-events: [STAFF_MEMBERSHIP_UPSERTED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/FacilityCode'
        - name: subject
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipPut' }
      responses:
        '200':
          description: The membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/participants/{participantRef}/care-team/{facilityCode}:
    put:
      tags: [care-team]
      operationId: addCareTeamFacility
      summary: Add a facility to a participant's care team
      description: The participant's ASHA worker (reason ASHA_REFERRAL) or an ADMIN (any reason, with X-Access-Reason). Idempotent. Facility staff then see the participant's record within their role.
      security:
        - oidc: [careteam:write]
        - oidc: [careteam:admin]
      x-roles: [ASHA_WORKER, ADMIN]
      x-data-access: The participant's ASHA worker, or ADMIN with a reason code.
      x-consent-prerequisite: SCREENING_PARTICIPATION in effect on the named consent event.
      x-audit-events: [CARE_TEAM_FACILITY_ADDED]
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ParticipantRef'
        - $ref: '#/components/parameters/FacilityCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareTeamAdd' }
      responses:
        '200':
          description: The care team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareTeam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/participants/{participantRef}/care-team:
    get:
      tags: [care-team]
      operationId: getCareTeam
      summary: A participant's care team
      security:
        - oidc: [careteam:read]
        - oidc: [careteam:admin]
      x-roles: [ASHA_WORKER, CLINICIAN, COUNSELLOR, HEALTH_STAFF, ADMIN]
      x-data-access: The ASHA worker, staff of a care-team facility, or ADMIN with a reason code. Others get 404.
      x-consent-prerequisite: none
      x-audit-events: [CARE_TEAM_READ]
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ParticipantRef'
      responses:
        '200':
          description: The care team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareTeam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/me/care-memberships:
    get:
      tags: [care-team]
      operationId: listMyCareMemberships
      summary: The caller's facilities and roles
      description: Only memberships whose role the caller also holds in their token.
      security:
        - oidc: [careteam:read]
      x-roles: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-data-access: The caller's own memberships.
      x-consent-prerequisite: none (no participant data)
      x-audit-events: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyMemberships' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters:
    post:
      tags: [encounters]
      operationId: createEncounter
      summary: Open an encounter
      description: SYNTHETIC only (DATA_ORIGIN_NOT_PERMITTED otherwise). The recorded care_role is the strongest role the caller holds at the facility.
      security:
        - oidc: [encounters:write]
      x-roles: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-consent-prerequisite: CLINICAL_CARE in effect on consent_event_id (CONSENT_NOT_ACTIVE otherwise); facility_code on the participant's care team and the caller working there in a role allowed for the type (HEALTH_STAFF only IN_PERSON).
      x-audit-events: [ENCOUNTER_CREATED, ENCOUNTER_REJECTED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncounterCreate' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters/{encounterId}:
    get:
      tags: [encounters]
      operationId: getEncounter
      summary: Read an encounter (role-filtered)
      description: HEALTH_STAFF get no instruments, notes or diagnoses. Notes are returned only to CLINICIAN or COUNSELLOR working at the encounter's facility, only while notes are enabled. no-store.
      security:
        - oidc: [encounters:read]
      x-roles: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-consent-prerequisite: none for reading; staff on the participant's care team only.
      x-audit-events: [ENCOUNTER_READ, CLINICAL_NOTE_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters/{encounterId}/instrument-responses:
    post:
      tags: [encounters]
      operationId: submitInstrumentResponse
      summary: Record a validated instrument (PHQ-9, GAD-7)
      description: One response per instrument per encounter. The score follows the instrument's published rule, only when every item is answered; it is an instrument score, never a diagnosis. Any PHQ-9 item 9 answer above NOT_AT_ALL raises the urgent-review flag.
      security:
        - oidc: [encounters:write]
      x-roles: [CLINICIAN, COUNSELLOR]
      x-consent-prerequisite: CLINICAL_CARE in effect on the encounter's consent event; the encounter's facility on the participant's care team, and the caller working there.
      x-audit-events: [INSTRUMENT_RESPONSE_SUBMITTED, URGENT_REVIEW_FLAG_RAISED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentResponseCreate' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentResult' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters/{encounterId}/notes:
    post:
      tags: [encounters]
      operationId: addClinicalNote
      summary: Add an encrypted clinical note
      description: Off by default (422 CLINICAL_NOTES_DISABLED) until a sensitive-text policy is approved. Append-only, AES-GCM encrypted, never logged, never exported, never shown to ASHA workers or HEALTH_STAFF.
      security:
        - oidc: [encounters:write]
      x-roles: [CLINICIAN, COUNSELLOR]
      x-consent-prerequisite: CLINICAL_CARE in effect on the encounter's consent event; the encounter's facility on the participant's care team, and the caller working there.
      x-audit-events: [CLINICAL_NOTE_ADDED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteStored' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters/{encounterId}/diagnoses:
    post:
      tags: [encounters]
      operationId: recordDiagnosis
      summary: Record a clinician-entered diagnosis
      description: Entered by a clinician, never generated. ICD-10 chapter F or ICD-11 chapter 6 codes only. Append-only; a later entry (for example RULED_OUT) supersedes an earlier one.
      security:
        - oidc: [encounters:write]
      x-roles: [CLINICIAN]
      x-consent-prerequisite: CLINICAL_CARE in effect on the encounter's consent event; the encounter's facility on the participant's care team, and the caller working there.
      x-audit-events: [DIAGNOSIS_RECORDED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosisCreate' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnosis' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnosis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters/{encounterId}/care-plan:
    post:
      tags: [encounters]
      operationId: recordCarePlan
      summary: Record the care plan and follow-up tasks
      description: One plan per encounter. Tasks for the ASHA worker need the participant to have one (400 otherwise). referral_target records the intended pathway; it sends nothing (partner referrals are separate, ADR-015).
      security:
        - oidc: [encounters:write]
      x-roles: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-consent-prerequisite: CLINICAL_CARE in effect on the encounter's consent event; the encounter's facility on the participant's care team, and the caller working there.
      x-audit-events: [CARE_PLAN_RECORDED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarePlanCreate' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarePlan' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarePlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/encounters/{encounterId}/close:
    post:
      tags: [encounters]
      operationId: closeEncounter
      summary: Close an encounter
      description: A closed encounter accepts no further entries (409).
      security:
        - oidc: [encounters:write]
      x-roles: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-consent-prerequisite: CLINICAL_CARE in effect on the encounter's consent event; the encounter's facility on the participant's care team, and the caller working there.
      x-audit-events: [ENCOUNTER_CLOSED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncounterClose' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/participants/{participantRef}/timeline:
    get:
      tags: [encounters]
      operationId: getParticipantTimeline
      summary: A participant's visits and encounters
      description: ASHA visits and clinic encounters, oldest first, as coded summaries. Severity bands are included only for CLINICIAN and COUNSELLOR. no-store.
      security:
        - oidc: [encounters:read]
      x-roles: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
      x-consent-prerequisite: none; staff on the participant's care team only.
      x-audit-events: [TIMELINE_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ParticipantRef'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/care-tasks:
    get:
      tags: [encounters]
      operationId: listCareTasks
      summary: Follow-up tasks assigned to the caller (ASHA)
      description: Tasks for the caller's assigned participants. No scores, notes or diagnoses.
      security:
        - oidc: [cases:read]
      x-roles: [ASHA_WORKER]
      x-consent-prerequisite: CLINICAL_CARE still in effect on the encounter behind each task; others are left out.
      x-audit-events: [CARE_TASK_LIST_READ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, ALL], default: OPEN }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/care-tasks/{taskId}/completion:
    post:
      tags: [encounters]
      operationId: completeCareTask
      summary: Mark a follow-up task done
      security:
        - oidc: [cases:write]
      x-roles: [ASHA_WORKER]
      x-consent-prerequisite: CLINICAL_CARE still in effect on the encounter behind the task.
      x-audit-events: [CARE_TASK_COMPLETED]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCompletion' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareTask' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableConsent' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8081/realms/wellness-local/.well-known/openid-configuration
      description: Local development identity provider (Keycloak in Docker Compose). Production IdP not yet selected.

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Client-supplied UUID that is propagated to logs, audit events and the processing worker.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, stable across retries of the same logical request.
      schema: { type: string, format: uuid }
    AccessReason:
      name: X-Access-Reason
      in: header
      required: false
      description: Required (enforced by the server) when the caller accesses a participant-linked record through the ADMIN role. Reason code only, no free text.
      schema: { type: string, enum: [SUPPORT_TICKET, DATA_SUBJECT_REQUEST, AUDIT, INCIDENT_RESPONSE] }
    ConsentEventId:
      name: consentEventId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ConsentEventId' }
    ParticipantRef:
      name: participantRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ParticipantRef' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SessionId' }
    RecordingId:
      name: recordingId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RecordingId' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/JobId' }
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema: { type: string, pattern: '^enc_[a-f0-9]{32}$' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: '^task_[a-f0-9]{32}$' }
    FacilityCode:
      name: facilityCode
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CaseId' }

  headers:
    CorrelationId:
      description: Correlation ID for this request (echoed or generated).
      schema: { type: string, format: uuid }
    Location:
      description: URL of the created resource.
      schema: { type: string }

  responses:
    BadRequest:
      description: Request failed schema validation. `errors` lists field paths and rule names, never submitted values.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validation: { $ref: '#/components/examples/ProblemValidationExample' }
    Unauthorized:
      description: Missing, expired or invalid access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated, but the role, scope or participant assignment does not permit this action. The response does not reveal whether the resource exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found, or not visible to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Idempotency key reused with a different body, resource ID already used, or content checksum differs from stored content.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableConsent:
      description: Request is well-formed but violates a consent or domain rule (for example CONSENT_NOT_ACTIVE, CONSENT_PARTICIPANT_MISMATCH, ADULT_CONFIRMATION_REQUIRED, CHECKSUM_MISMATCH or RECORDING_NOT_UPLOADED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            consentNotActive: { $ref: '#/components/examples/ProblemConsentExample' }
    PayloadTooLarge:
      description: Audio exceeds the v1 size limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Audio format not accepted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded; retry after the indicated delay.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected server error. Safe to retry idempotent requests with the same Idempotency-Key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ParticipantRef:
      type: string
      pattern: '^ppt_[a-f0-9]{32}$'
      description: Pseudonymous participant reference, randomly generated at enrolment. The mapping to identity is held only in the identity module.
    ConsentEventId:
      type: string
      pattern: '^ce_[a-f0-9]{32}$'
    WithdrawalId:
      type: string
      pattern: '^cw_[a-f0-9]{32}$'
    SessionId:
      type: string
      pattern: '^sess_[a-f0-9]{32}$'
    RecordingId:
      type: string
      pattern: '^rec_[a-f0-9]{32}$'
    JobId:
      type: string
      pattern: '^job_[a-f0-9]{32}$'
    FeatureRecordId:
      type: string
      pattern: '^frec_[a-f0-9]{32}$'
    LanguageTag:
      type: string
      enum: [en-IN, te-IN, hi-IN, ta-IN, bn-IN, mr-IN, kn-IN, ml-IN, gu-IN, pa-IN, ur-IN, or-IN]
      description: |
        Languages for consent and cases (1.1 added ten). Adding a language is a minor version change.
        Translations other than en-IN are UNAPPROVED prototype translations: usable with synthetic
        data only until validated translations are approved (consent-and-data-lifecycle.md §14).
    VoiceLanguageTag:
      type: string
      enum: [en-IN, kn-IN]
      description: Languages accepted for voice sessions. Kept at the feature-record schema's set (v2.0.0); widening it needs a feature-record version and research review.
    Timestamp:
      type: string
      format: date-time
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'

    ConsentScope:
      type: string
      description: Approved for implementation with synthetic data (2026-10-18; EXTERNAL_REFERRAL_SHARING added by the repository owner 2026-10-20); privacy/legal review pending. Definitions are in docs/privacy/consent-and-data-lifecycle.md.
      enum:
        - SCREENING_PARTICIPATION
        - AUDIO_RECORDING
        - AUDIO_RETENTION
        - RESEARCH_FEATURE_REUSE
        - MODEL_TRAINING
        - QUALITY_REVIEW
        - EXTERNAL_REFERRAL_SHARING
        - CLINICAL_CARE

    ScopeDecision:
      type: object
      required: [scope, granted]
      additionalProperties: false
      properties:
        scope: { $ref: '#/components/schemas/ConsentScope' }
        granted:
          type: boolean
          description: Explicit decision. There are no defaults, and every scope offered by the form version must appear.

    ConsentEventCreate:
      type: object
      required: [consent_event_id, participant_ref, consent_form, scope_decisions, capture, safeguards]
      additionalProperties: false
      properties:
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_form:
          type: object
          required: [form_id, form_version, language_tag]
          additionalProperties: false
          properties:
            form_id: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
            form_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            language_tag: { $ref: '#/components/schemas/LanguageTag' }
        scope_decisions:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/ScopeDecision' }
          description: |
            Server rejects (422 CONSENT_SCOPE_INCOMPLETE) if a scope offered by the form version is
            missing, or a scope is granted without the scopes it depends on. Dependency graph:
            AUDIO_RECORDING → SCREENING_PARTICIPATION; AUDIO_RETENTION, RESEARCH_FEATURE_REUSE and
            QUALITY_REVIEW → AUDIO_RECORDING; MODEL_TRAINING → RESEARCH_FEATURE_REUSE;
            EXTERNAL_REFERRAL_SHARING → SCREENING_PARTICIPATION (1.3, ADR-015). CLINICAL_CARE has no
            dependency (1.5, ADR-016): care by facility staff, asked on the clinic consent form.
        capture:
          type: object
          required: [captured_at_utc, method, read_aloud, comprehension_confirmed]
          additionalProperties: false
          properties:
            captured_at_utc: { $ref: '#/components/schemas/Timestamp' }
            method:
              type: string
              enum: [SIGNED_ON_DEVICE, THUMBPRINT_ON_DEVICE, VERBAL_WITNESSED]
              description: Which methods are acceptable is an open legal question (see consent-and-data-lifecycle.md).
            read_aloud:
              type: boolean
              description: Form was read aloud to the participant.
            comprehension_confirmed:
              type: boolean
              const: true
              description: The worker confirmed the participant understood. Must be true.
            witness_present: { type: boolean }
        safeguards:
          type: object
          required: [adult_confirmed]
          additionalProperties: false
          properties:
            adult_confirmed:
              type: boolean
              const: true
              description: v1 accepts adult participants only. Minors are blocked until the guardian-consent policy is approved.
            assisted_consent:
              type: boolean
              description: Participant needed additional support to consent. Policy for who may assist is pending.
        facility_code:
          type: string
          pattern: '^[a-z0-9-]{3,40}$'
          description: |
            Required when facility staff record consent (1.5, ADR-016); omitted by ASHA workers. The
            recorder must work at the facility. A new participant isn't assigned to any ASHA worker;
            the facility joins their care team. An existing participant must already have the
            recorder on their care team.

    ConsentEvent:
      type: object
      required: [consent_event_id, participant_ref, consent_form, scope_decisions, status, effective_scopes, captured_at_utc, received_at_utc]
      additionalProperties: false
      properties:
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_form:
          type: object
          required: [form_id, form_version, language_tag]
          additionalProperties: false
          properties:
            form_id: { type: string }
            form_version: { type: string }
            language_tag: { $ref: '#/components/schemas/LanguageTag' }
        scope_decisions:
          type: array
          items: { $ref: '#/components/schemas/ScopeDecision' }
        status:
          type: string
          enum: [ACTIVE, PARTIALLY_WITHDRAWN, WITHDRAWN, EXPIRED]
        effective_scopes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ConsentScope' }
        captured_by_worker_ref:
          type: string
          pattern: '^wkr_[a-f0-9]{32}$'
          description: Pseudonym of the capturing ASHA worker (from the token).
        captured_at_utc: { $ref: '#/components/schemas/Timestamp' }
        received_at_utc: { $ref: '#/components/schemas/Timestamp' }
        expires_at_utc:
          type: [string, 'null']
          format: date-time
          description: Null until the retention and expiry policy is approved.

    ConsentWithdrawalCreate:
      type: object
      required: [withdrawal_id, withdrawn_at_utc, channel]
      additionalProperties: false
      properties:
        withdrawal_id: { $ref: '#/components/schemas/WithdrawalId' }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ConsentScope' }
          description: |
            Scopes to withdraw. Omit to withdraw all scopes. Withdrawal cascades transitively to
            every dependent scope (see the dependency graph on ConsentEventCreate.scope_decisions):
            SCREENING_PARTICIPATION withdraws everything that depends on it (including
            EXTERNAL_REFERRAL_SHARING, which revokes partner referrals) but not CLINICAL_CARE, which is
            a separate consent; omitting `scopes` withdraws everything; AUDIO_RECORDING also withdraws
            AUDIO_RETENTION, RESEARCH_FEATURE_REUSE, MODEL_TRAINING and QUALITY_REVIEW;
            RESEARCH_FEATURE_REUSE also withdraws MODEL_TRAINING. `withdrawn_scopes` in the
            response lists the full cascaded set.
        withdrawn_at_utc: { $ref: '#/components/schemas/Timestamp' }
        channel:
          type: string
          enum: [IN_PERSON_ASHA, IN_PERSON_CLINICIAN, PHONE_TO_PROGRAMME, WRITTEN_REQUEST]
        reason_code:
          type: [string, 'null']
          enum: [NO_LONGER_WISHES, PRIVACY_CONCERN, OTHER, NOT_STATED, null]
          description: Optional and never required of the participant. No free text.

    ConsentWithdrawal:
      type: object
      required: [withdrawal_id, consent_event_id, withdrawn_scopes, resulting_status, downstream_actions, recorded_at_utc]
      additionalProperties: false
      properties:
        withdrawal_id: { $ref: '#/components/schemas/WithdrawalId' }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        withdrawn_scopes:
          type: array
          items: { $ref: '#/components/schemas/ConsentScope' }
        resulting_status:
          type: string
          enum: [ACTIVE, PARTIALLY_WITHDRAWN, WITHDRAWN]
          description: ACTIVE only for a no-op (none of the requested scopes were in effect).
        downstream_actions:
          type: array
          items:
            type: object
            required: [action, status]
            additionalProperties: false
            properties:
              action:
                type: string
                enum: [CANCEL_QUEUED_PROCESSING, EXCLUDE_FROM_RESEARCH_EXPORT, DELETE_RETAINED_AUDIO, FLAG_DERIVED_FEATURES, REVOKE_EXTERNAL_REFERRAL]
              status:
                type: string
                enum: [SCHEDULED, COMPLETED, NOT_APPLICABLE]
        recorded_at_utc: { $ref: '#/components/schemas/Timestamp' }

    ConsentStatus:
      type: object
      required: [participant_ref, status, effective_scopes, as_of_utc]
      additionalProperties: false
      properties:
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        status:
          type: string
          enum: [NO_CONSENT, ACTIVE, PARTIALLY_WITHDRAWN, WITHDRAWN, EXPIRED]
        active_consent_event_id:
          oneOf:
            - $ref: '#/components/schemas/ConsentEventId'
            - type: 'null'
        effective_scopes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ConsentScope' }
        as_of_utc: { $ref: '#/components/schemas/Timestamp' }

    VoiceSessionCreate:
      type: object
      required: [session_id, participant_ref, consent_event_id, language_tag, prompt_set, captured_at_utc, device, data_origin]
      additionalProperties: false
      properties:
        session_id: { $ref: '#/components/schemas/SessionId' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        language_tag: { $ref: '#/components/schemas/VoiceLanguageTag' }
        prompt_set:
          type: object
          required: [prompt_set_id, prompt_set_version]
          additionalProperties: false
          description: Which speaking tasks were shown (for example sustained vowel or reading passage). Prompt content is versioned separately. Spoken content is never transcribed in v1.
          properties:
            prompt_set_id: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
            prompt_set_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        captured_at_utc: { $ref: '#/components/schemas/Timestamp' }
        device:
          type: object
          required: [device_class, app_version, os_family]
          additionalProperties: false
          description: Device class only. No device identifiers, IMEI or advertising IDs.
          properties:
            device_class: { type: string, enum: [ANDROID_PHONE, IOS_PHONE, TABLET, UNKNOWN] }
            app_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            os_family: { type: string, enum: [ANDROID, IOS] }
        data_origin:
          type: string
          enum: [SYNTHETIC, AUTHORIZED_TEST_AUDIO, PARTICIPANT]
          description: PARTICIPANT is rejected (422) by any environment not approved for real participant data. All environments are unapproved today.

    VoiceSession:
      type: object
      required: [session_id, participant_ref, consent_event_id, language_tag, status, data_origin, recordings, created_at_utc]
      additionalProperties: false
      properties:
        session_id: { $ref: '#/components/schemas/SessionId' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        language_tag: { $ref: '#/components/schemas/VoiceLanguageTag' }
        status:
          type: string
          enum: [CREATED, AWAITING_CONTENT, UPLOADED, PROCESSING, PROCESSED, PROCESSING_FAILED, CANCELLED]
        data_origin:
          type: string
          enum: [SYNTHETIC, AUTHORIZED_TEST_AUDIO, PARTICIPANT]
        recordings:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        created_at_utc: { $ref: '#/components/schemas/Timestamp' }

    RecordingCreate:
      type: object
      required: [recording_id, prompt_id, format, sampling_rate_hz, channels, duration_seconds, size_bytes, sha256, recorded_at_utc]
      additionalProperties: false
      properties:
        recording_id: { $ref: '#/components/schemas/RecordingId' }
        prompt_id: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
        format: { type: string, enum: [WAV_PCM_S16LE, FLAC] }
        sampling_rate_hz: { type: integer, enum: [16000, 22050, 44100, 48000] }
        channels: { type: integer, enum: [1] }
        duration_seconds: { type: number, minimum: 3, maximum: 180 }
        size_bytes: { type: integer, minimum: 1, maximum: 26214400 }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        recorded_at_utc: { $ref: '#/components/schemas/Timestamp' }
        device_prescreen:
          type: object
          additionalProperties: false
          description: Informational on-device checks only; they do not replace server-side quality control.
          properties:
            peak_dbfs: { type: [number, 'null'], maximum: 0 }
            clipping_detected: { type: boolean }
            low_level_detected: { type: boolean }

    Recording:
      type: object
      required: [recording_id, session_id, prompt_id, format, duration_seconds, sha256, upload_status]
      additionalProperties: false
      properties:
        recording_id: { $ref: '#/components/schemas/RecordingId' }
        session_id: { $ref: '#/components/schemas/SessionId' }
        prompt_id: { type: string }
        format: { type: string, enum: [WAV_PCM_S16LE, FLAC] }
        duration_seconds: { type: number }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        upload_status:
          type: string
          enum: [AWAITING_CONTENT, STORED, REJECTED, DELETED]
        upload_path:
          type: [string, 'null']
          description: Relative path for content upload while AWAITING_CONTENT; null otherwise.
        stored_at_utc:
          type: [string, 'null']
          format: date-time

    ProcessingJobCreate:
      type: object
      required: [recording_id, pipeline_profile]
      additionalProperties: false
      properties:
        recording_id: { $ref: '#/components/schemas/RecordingId' }
        pipeline_profile:
          type: string
          enum: [EGEMAPS_V02_FUNCTIONALS_V1]
          description: Named, versioned extraction profile. It maps to an immutable openSMILE config in the worker.

    ProcessingJob:
      type: object
      required: [job_id, recording_id, session_id, pipeline_profile, status, attempt, created_at_utc, updated_at_utc]
      additionalProperties: false
      properties:
        job_id: { $ref: '#/components/schemas/JobId' }
        recording_id: { $ref: '#/components/schemas/RecordingId' }
        session_id: { $ref: '#/components/schemas/SessionId' }
        pipeline_profile: { type: string, enum: [EGEMAPS_V02_FUNCTIONALS_V1] }
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        attempt: { type: integer, minimum: 0, maximum: 3 }
        quality_outcome:
          oneOf:
            - type: 'null'
            - type: object
              required: [status, flags]
              additionalProperties: false
              properties:
                status: { type: string, enum: [PASS, DEGRADED, FAIL] }
                flags:
                  type: array
                  uniqueItems: true
                  items: { type: string, enum: [CLIPPING, LOW_LEVEL, SHORT_DURATION, LONG_DURATION, HIGH_NOISE, LOW_SPEECH_RATIO, SILENCE, FORMAT_MISMATCH] }
          description: Present once the worker has run quality control. A FAIL outcome results in status FAILED with failure.code AUDIO_QUALITY_FAILED, so the worker can ask for a re-recording.
        feature_record_id:
          oneOf:
            - $ref: '#/components/schemas/FeatureRecordId'
            - type: 'null'
          description: Set when status is SUCCEEDED. Feature values are not exposed through this API.
        failure:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, retryable]
              additionalProperties: false
              properties:
                code: { type: string, enum: [AUDIO_QUALITY_FAILED, AUDIO_DECODE_FAILED, EXTRACTION_ERROR, TIMEOUT, CONSENT_WITHDRAWN, INTERNAL_ERROR] }
                retryable: { type: boolean }
        created_at_utc: { $ref: '#/components/schemas/Timestamp' }
        updated_at_utc: { $ref: '#/components/schemas/Timestamp' }
      allOf:
        - if: { properties: { status: { const: SUCCEEDED } } }
          then:
            required: [feature_record_id, quality_outcome]
            properties: { feature_record_id: { $ref: '#/components/schemas/FeatureRecordId' } }
        - if: { properties: { status: { enum: [FAILED, CANCELLED] } } }
          then:
            required: [failure]
            properties: { failure: { type: object } }

    CaseId:
      type: string
      pattern: '^case_[a-f0-9]{32}$'
    ObservationSetId:
      type: string
      pattern: '^obs_[a-f0-9]{32}$'
    QuestionnaireResponseId:
      type: string
      pattern: '^qr_[a-f0-9]{32}$'
    CaseDataOrigin:
      type: string
      enum: [SYNTHETIC, PARTICIPANT]
      description: Only SYNTHETIC is accepted in 1.1 (422 DATA_ORIGIN_NOT_PERMITTED otherwise). The questionnaire is not validated and no environment is approved for participant data.
    AgeBand:
      type: string
      enum: [AGE_UNDER_18, AGE_18_29, AGE_30_44, AGE_45_59, AGE_60_PLUS]
      description: Coded age group, never a date of birth. AGE_UNDER_18 is rejected (422 ADULT_CONFIRMATION_REQUIRED) until an approved child pathway exists.
    Gender:
      type: string
      enum: [NOT_STATED, FEMALE, MALE, OTHER]
    CodedValue:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,40}$'

    CaseCreate:
      type: object
      required: [case_id, participant_ref, consent_event_id, language_tag, opened_at_utc, data_origin, age_band]
      additionalProperties: false
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        language_tag: { $ref: '#/components/schemas/LanguageTag' }
        opened_at_utc: { $ref: '#/components/schemas/Timestamp' }
        data_origin: { $ref: '#/components/schemas/CaseDataOrigin' }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        gender:
          $ref: '#/components/schemas/Gender'
          description: Optional; NOT_STATED when omitted.

    Case:
      type: object
      required: [case_id, participant_ref, consent_event_id, language_tag, data_origin, age_band, gender, status,
                 urgent_review_flag, follow_up_requested, observations_submitted, questionnaire_submitted,
                 opened_by_worker_ref, opened_at_utc, completed_at_utc, created_at_utc, review]
      additionalProperties: false
      properties:
        case_id: { $ref: '#/components/schemas/CaseId' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        language_tag: { $ref: '#/components/schemas/LanguageTag' }
        data_origin: { $ref: '#/components/schemas/CaseDataOrigin' }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        gender: { $ref: '#/components/schemas/Gender' }
        status:
          type: string
          enum: [OPEN, COMPLETED]
        urgent_review_flag:
          type: boolean
          description: Set when the safety question was answered SOMETIMES or OFTEN. It asks for prompt human follow-up under the approved safety protocol (not yet defined, consent-and-data-lifecycle.md §13). It is not a risk score or diagnosis.
        follow_up_requested:
          type: [boolean, 'null']
          description: The worker's follow-up decision; null until the case is completed.
        observations_submitted: { type: boolean }
        questionnaire_submitted: { type: boolean }
        opened_by_worker_ref:
          type: string
          pattern: '^wkr_[a-f0-9]{32}$'
        opened_at_utc: { $ref: '#/components/schemas/Timestamp' }
        completed_at_utc:
          type: [string, 'null']
          format: date-time
        created_at_utc: { $ref: '#/components/schemas/Timestamp' }
        review: { $ref: '#/components/schemas/CaseReviewState' }

    CaseList:
      type: object
      required: [cases]
      additionalProperties: false
      properties:
        cases:
          type: array
          items: { $ref: '#/components/schemas/Case' }

    ObservationSetCreate:
      type: object
      required: [observation_set_id, catalogue, observed_at_utc, observations]
      additionalProperties: false
      description: |
        Coded observations from catalogue `asha-observations` 0.1.0 (the server rejects any other
        code or value with 400):
        - HEALTH_CONDITION (repeatable): HYPERTENSION, DIABETES, HEART_DISEASE, BREATHING_PROBLEM,
          OTHER_LONG_TERM_ILLNESS; or exactly one of NONE_REPORTED, DECLINED
        - TOBACCO_USE: NOT_REPORTED, REPORTED, DECLINED
        - ALCOHOL_USE: NOT_REPORTED, REPORTED, DECLINED
        - SLEEP_QUALITY: GOOD, SOME_DIFFICULTY, VERY_POOR, DECLINED
      properties:
        observation_set_id: { $ref: '#/components/schemas/ObservationSetId' }
        catalogue:
          type: object
          required: [catalogue_id, catalogue_version]
          additionalProperties: false
          properties:
            catalogue_id: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
            catalogue_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        observed_at_utc: { $ref: '#/components/schemas/Timestamp' }
        observations:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: object
            required: [code, value_code]
            additionalProperties: false
            properties:
              code:
                type: string
                enum: [HEALTH_CONDITION, TOBACCO_USE, ALCOHOL_USE, SLEEP_QUALITY]
              value_code: { $ref: '#/components/schemas/CodedValue' }

    QuestionnaireResponseCreate:
      type: object
      required: [response_id, instrument, language_tag, answered_at_utc, items]
      additionalProperties: false
      description: |
        Instrument `illustrative-wellness` 0.1.0 (NOT VALIDATED; synthetic data only). Items and
        answer codes (anything else is rejected with 400; SELF_HARM_THOUGHTS is required):
        - ANXIETY, LOW_MOOD: NOT_AT_ALL, SEVERAL_DAYS, MORE_THAN_HALF_THE_DAYS, NEARLY_EVERY_DAY, DECLINED
        - INTEREST: AS_USUAL, LESS_THAN_BEFORE, NOT_AT_ALL, DECLINED
        - SELF_HARM_THOUGHTS: NO, SOMETIMES, OFTEN, DECLINED
      properties:
        response_id: { $ref: '#/components/schemas/QuestionnaireResponseId' }
        instrument:
          type: object
          required: [instrument_id, instrument_version]
          additionalProperties: false
          properties:
            instrument_id: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
            instrument_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        language_tag: { $ref: '#/components/schemas/LanguageTag' }
        answered_at_utc: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [item_id, answer_code]
            additionalProperties: false
            properties:
              item_id: { $ref: '#/components/schemas/CodedValue' }
              answer_code: { $ref: '#/components/schemas/CodedValue' }

    CaseCompletion:
      type: object
      required: [completed_at_utc, follow_up_requested]
      additionalProperties: false
      properties:
        completed_at_utc: { $ref: '#/components/schemas/Timestamp' }
        follow_up_requested:
          type: boolean
          description: The worker flags the case for follow-up by a trained health professional.

    ReviewDecision:
      type: string
      enum: [NO_FURTHER_ACTION, MONITOR, REFER, URGENT_REFER]
      description: A clinician's judgement. Referral pathways themselves are programme configuration (not yet defined).
    FollowUpWithin:
      type: string
      enum: [NONE, WITHIN_24_HOURS, WITHIN_7_DAYS, WITHIN_30_DAYS]
    CaseReviewState:
      type: object
      required: [status, decision, follow_up_within, reviewed_at_utc]
      additionalProperties: false
      description: The latest clinician decision on the case, as shown to the ASHA worker.
      properties:
        status:
          type: string
          enum: [NOT_REQUIRED, AWAITING_REVIEW, REVIEWED]
          description: NOT_REQUIRED when the case has neither an urgent-review flag nor a follow-up request.
        decision:
          oneOf:
            - $ref: '#/components/schemas/ReviewDecision'
            - type: 'null'
        follow_up_within:
          oneOf:
            - $ref: '#/components/schemas/FollowUpWithin'
            - type: 'null'
        reviewed_at_utc:
          type: [string, 'null']
          format: date-time

    ReviewQueue:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [priority, case]
            additionalProperties: false
            properties:
              priority:
                type: string
                enum: [URGENT, ROUTINE]
                description: URGENT when the case carries an urgent-review flag. Ordering only; not a risk level.
              case: { $ref: '#/components/schemas/Case' }

    ReviewCase:
      type: object
      required: [priority, case, observations, questionnaire, reviews]
      additionalProperties: false
      properties:
        priority: { type: string, enum: [URGENT, ROUTINE] }
        case: { $ref: '#/components/schemas/Case' }
        observations:
          type: array
          items:
            type: object
            required: [code, value_code]
            additionalProperties: false
            properties:
              code: { type: string, enum: [HEALTH_CONDITION, TOBACCO_USE, ALCOHOL_USE, SLEEP_QUALITY] }
              value_code: { $ref: '#/components/schemas/CodedValue' }
        questionnaire:
          oneOf:
            - type: 'null'
            - type: object
              required: [instrument_id, instrument_version, validated, items]
              additionalProperties: false
              properties:
                instrument_id: { type: string }
                instrument_version: { type: string }
                validated:
                  type: boolean
                  description: False for illustrative-wellness 0.1.0. Shown so reviewers never mistake it for a validated instrument.
                items:
                  type: array
                  items:
                    type: object
                    required: [item_id, answer_code]
                    additionalProperties: false
                    properties:
                      item_id: { $ref: '#/components/schemas/CodedValue' }
                      answer_code: { $ref: '#/components/schemas/CodedValue' }
        reviews:
          type: array
          description: Every review, oldest first.
          items: { $ref: '#/components/schemas/ClinicianReview' }

    ClinicianReviewCreate:
      type: object
      required: [review_id, decision, follow_up_within, reviewed_at_utc]
      additionalProperties: false
      properties:
        review_id: { type: string, pattern: '^rvw_[a-f0-9]{32}$' }
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        follow_up_within: { $ref: '#/components/schemas/FollowUpWithin' }
        reviewed_at_utc: { $ref: '#/components/schemas/Timestamp' }

    ClinicianReview:
      type: object
      required: [review_id, case_id, decision, follow_up_within, reviewed_by_ref, reviewed_at_utc, recorded_at_utc]
      additionalProperties: false
      properties:
        review_id: { type: string, pattern: '^rvw_[a-f0-9]{32}$' }
        case_id: { $ref: '#/components/schemas/CaseId' }
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        follow_up_within: { $ref: '#/components/schemas/FollowUpWithin' }
        reviewed_by_ref:
          type: string
          pattern: '^clin_[a-f0-9]{32}$'
          description: Pseudonym of the reviewing clinician (from the token).
        reviewed_at_utc: { $ref: '#/components/schemas/Timestamp' }
        recorded_at_utc: { $ref: '#/components/schemas/Timestamp' }

    SupportContactList:
      type: object
      required: [contacts]
      additionalProperties: false
      properties:
        contacts:
          type: array
          items:
            type: object
            required: [contact_id, service_name, dial_number, tel_uri, hours, coverage, verified, verified_by, verified_on]
            additionalProperties: false
            properties:
              contact_id: { type: string, pattern: '^[a-z0-9-]{2,40}$' }
              service_name: { type: string, maxLength: 80 }
              dial_number: { type: string, pattern: '^\+?[0-9][0-9 -]{2,19}$' }
              tel_uri: { type: string, pattern: '^tel:\+?[0-9]{3,20}$' }
              hours: { type: [string, 'null'] }
              coverage: { type: string, enum: [NATIONAL, STATE, DISTRICT] }
              verified:
                type: boolean
                description: False until the clinical lead verifies the contact for the programme area.
              verified_by: { type: [string, 'null'] }
              verified_on: { type: [string, 'null'], format: date }

    ReferralStatus:
      type: string
      enum: [QUEUED, SENT, RECEIVED, CONTACT_ATTEMPTED, CONTACTED, APPOINTMENT_BOOKED, CLOSED, DECLINED, DELIVERY_FAILED, REVOKED]
      description: QUEUED until delivered, SENT once the partner accepted it, then the partner's own coded statuses. REVOKED after consent withdrawal.
    PartnerList:
      type: object
      required: [partners]
      additionalProperties: false
      properties:
        partners:
          type: array
          items:
            type: object
            required: [partner_id, partner_label, kind, mode]
            additionalProperties: false
            properties:
              partner_id: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
              partner_label: { type: string }
              kind: { type: string, enum: [TELE_MANAS, ESANJEEVANI, ABDM, HMIS] }
              mode: { type: string, enum: [SIMULATED, REAL] }
    ReferralCreate:
      type: object
      required: [referral_id, partner_id, review_id]
      additionalProperties: false
      properties:
        referral_id: { type: string, pattern: '^ref_[a-f0-9]{32}$' }
        partner_id: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        review_id: { type: string, pattern: '^rvw_[a-f0-9]{32}$' }
    Referral:
      type: object
      required: [referral_id, case_id, partner_id, partner_name, partner_mode, decision, follow_up_within, handoff_code, status, status_at_utc, created_at_utc]
      additionalProperties: false
      properties:
        referral_id: { type: string, pattern: '^ref_[a-f0-9]{32}$' }
        case_id: { $ref: '#/components/schemas/CaseId' }
        partner_id: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        partner_name: { type: string }
        partner_mode: { type: string, enum: [SIMULATED, REAL, UNKNOWN] }
        decision: { type: string, enum: [REFER, URGENT_REFER] }
        follow_up_within: { type: string, enum: [WITHIN_24_HOURS, WITHIN_7_DAYS, WITHIN_30_DAYS] }
        handoff_code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          description: Quoted by the ASHA worker when connecting the person to the partner (warm handoff). Not an identifier of the person.
        status: { $ref: '#/components/schemas/ReferralStatus' }
        status_at_utc: { $ref: '#/components/schemas/Timestamp' }
        created_at_utc: { $ref: '#/components/schemas/Timestamp' }
    ReferralList:
      type: object
      required: [referrals]
      additionalProperties: false
      properties:
        referrals:
          type: array
          items: { $ref: '#/components/schemas/Referral' }

    FacilityKind:
      type: string
      enum: [PHC, CHC, DISTRICT_HOSPITAL, TELE_CENTRE, COUNSELLING_CENTRE]
    CareRole:
      type: string
      enum: [CLINICIAN, COUNSELLOR, HEALTH_STAFF]
    FacilityPut:
      type: object
      required: [kind, facility_label, active]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/FacilityKind' }
        facility_label: { type: string, minLength: 1, maxLength: 80, description: 'Facility label, for example "PHC Testpur". Not an address.' }
        active: { type: boolean }
    Facility:
      type: object
      required: [facility_code, kind, facility_label, active]
      additionalProperties: false
      properties:
        facility_code: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        kind: { $ref: '#/components/schemas/FacilityKind' }
        facility_label: { type: string }
        active: { type: boolean }
    MembershipPut:
      type: object
      required: [care_role, active]
      additionalProperties: false
      properties:
        care_role: { $ref: '#/components/schemas/CareRole' }
        active: { type: boolean }
    Membership:
      type: object
      required: [facility_code, facility_label, kind, care_role]
      additionalProperties: false
      properties:
        facility_code: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        facility_label: { type: string }
        kind: { $ref: '#/components/schemas/FacilityKind' }
        care_role: { $ref: '#/components/schemas/CareRole' }
    MyMemberships:
      type: object
      required: [staff_ref, memberships]
      additionalProperties: false
      properties:
        staff_ref: { type: string, pattern: '^clin_[a-f0-9]{32}$' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    CareTeamAdd:
      type: object
      required: [reason_code, consent_event_id]
      additionalProperties: false
      properties:
        reason_code: { type: string, enum: [ASHA_REFERRAL, CLINIC_REGISTRATION, TRANSFER] }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
    CareTeam:
      type: object
      required: [participant_ref, asha_worker_ref, facilities]
      additionalProperties: false
      properties:
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        asha_worker_ref:
          type: [string, 'null']
          pattern: '^wkr_[a-f0-9]{32}$'
        facilities:
          type: array
          items:
            type: object
            required: [facility_code, facility_label, kind, reason_code, added_at_utc]
            additionalProperties: false
            properties:
              facility_code: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
              facility_label: { type: string }
              kind: { $ref: '#/components/schemas/FacilityKind' }
              reason_code: { type: string, enum: [ASHA_REFERRAL, CLINIC_REGISTRATION, TRANSFER] }
              added_at_utc: { $ref: '#/components/schemas/Timestamp' }

    CodedItem:
      type: object
      required: [item_id, answer_code]
      additionalProperties: false
      properties:
        item_id: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
        answer_code: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
    EncounterCreate:
      type: object
      required: [encounter_id, participant_ref, consent_event_id, facility_code, encounter_type, started_at_utc, data_origin]
      additionalProperties: false
      properties:
        encounter_id: { type: string, pattern: '^enc_[a-f0-9]{32}$' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        consent_event_id: { $ref: '#/components/schemas/ConsentEventId' }
        facility_code: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        encounter_type: { type: string, enum: [IN_PERSON, TELE_PHONE, TELE_VIDEO, COUNSELLING_SESSION] }
        series_id: { type: [string, 'null'], pattern: '^ser_[a-f0-9]{32}$', description: Groups a course of counselling sessions. }
        started_at_utc: { $ref: '#/components/schemas/Timestamp' }
        data_origin: { type: string, enum: [SYNTHETIC, PARTICIPANT] }
    InstrumentResponseCreate:
      type: object
      required: [response_id, instrument, language_tag, answered_at_utc, items]
      additionalProperties: false
      description: |
        Instruments in 1.5 (published scoring; translations not yet validated):
        - phq-9 1.0.0: items PHQ9_1 to PHQ9_9; total 0–27; bands MINIMAL 0–4, MILD 5–9,
          MODERATE 10–14, MODERATELY_SEVERE 15–19, SEVERE 20–27
        - gad-7 1.0.0: items GAD7_1 to GAD7_7; total 0–21; bands MINIMAL 0–4, MILD 5–9,
          MODERATE 10–14, SEVERE 15–21

        Answers: NOT_AT_ALL (0), SEVERAL_DAYS (1), MORE_THAN_HALF_THE_DAYS (2),
        NEARLY_EVERY_DAY (3), DECLINED (no score).
      properties:
        response_id: { type: string, pattern: '^ir_[a-f0-9]{32}$' }
        instrument:
          type: object
          required: [instrument_id, instrument_version]
          additionalProperties: false
          properties:
            instrument_id: { type: string, pattern: '^[a-z0-9-]{3,64}$' }
            instrument_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        language_tag: { $ref: '#/components/schemas/LanguageTag' }
        answered_at_utc: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/CodedItem' }
    InstrumentResult:
      type: object
      required: [response_id, instrument_id, instrument_version, translation_validated, complete, total_score, severity_band, urgent_review_flag, items]
      additionalProperties: false
      description: An instrument score by its published rule. It is not a diagnosis.
      properties:
        response_id: { type: string, pattern: '^ir_[a-f0-9]{32}$' }
        instrument_id: { type: string }
        instrument_version: { type: string }
        translation_validated: { type: boolean }
        complete: { type: boolean, description: False if any item is missing or DECLINED; then no score. }
        total_score: { type: [integer, 'null'], minimum: 0 }
        severity_band: { type: [string, 'null'] }
        urgent_review_flag: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/CodedItem' }
    NoteCreate:
      type: object
      required: [note_id, text]
      additionalProperties: false
      properties:
        note_id: { type: string, pattern: '^note_[a-f0-9]{32}$' }
        text: { type: string, minLength: 1, maxLength: 4000 }
    NoteStored:
      type: object
      required: [note_id, encounter_id, created_at_utc]
      additionalProperties: false
      properties:
        note_id: { type: string, pattern: '^note_[a-f0-9]{32}$' }
        encounter_id: { type: string, pattern: '^enc_[a-f0-9]{32}$' }
        created_at_utc: { $ref: '#/components/schemas/Timestamp' }
    DiagnosisCreate:
      type: object
      required: [diagnosis_id, code_system, code, certainty]
      additionalProperties: false
      properties:
        diagnosis_id: { type: string, pattern: '^dx_[a-f0-9]{32}$' }
        code_system: { type: string, enum: [ICD_11, ICD_10] }
        code: { type: string, pattern: '^[0-9A-Z.]{3,10}$', description: ICD-10 chapter F or ICD-11 chapter 6 only. }
        certainty: { type: string, enum: [PROVISIONAL, CONFIRMED, RULED_OUT] }
    Diagnosis:
      type: object
      required: [diagnosis_id, code_system, code, certainty, recorded_by_ref, recorded_at_utc]
      additionalProperties: false
      description: Entered by a clinician. Never generated by the platform.
      properties:
        diagnosis_id: { type: string, pattern: '^dx_[a-f0-9]{32}$' }
        code_system: { type: string, enum: [ICD_11, ICD_10] }
        code: { type: string }
        certainty: { type: string, enum: [PROVISIONAL, CONFIRMED, RULED_OUT] }
        recorded_by_ref: { type: string, pattern: '^clin_[a-f0-9]{32}$' }
        recorded_at_utc: { $ref: '#/components/schemas/Timestamp' }
    CarePlanCreate:
      type: object
      required: [plan_id, referral_target, tasks]
      additionalProperties: false
      properties:
        plan_id: { type: string, pattern: '^plan_[a-f0-9]{32}$' }
        next_contact_at_utc: { type: [string, 'null'], format: date-time }
        next_contact_mode: { type: [string, 'null'], enum: [IN_PERSON, PHONE, VIDEO, HOME_VISIT, null] }
        referral_target: { type: string, enum: [NONE, PSYCHIATRY_OPD, DISTRICT_MENTAL_HEALTH_PROGRAMME, TELE_MANAS, COUNSELLING, EMERGENCY_SERVICES] }
        tasks:
          type: array
          maxItems: 10
          items:
            type: object
            required: [task_id, assignee, task_type, due_by_utc]
            additionalProperties: false
            properties:
              task_id: { type: string, pattern: '^task_[a-f0-9]{32}$' }
              assignee: { type: string, enum: [ASHA_WORKER, FACILITY] }
              task_type: { type: string, enum: [HOME_VISIT, CHECK_IN_CALL, ACCOMPANY_TO_FACILITY, TREATMENT_ADHERENCE_CHECK] }
              due_by_utc: { $ref: '#/components/schemas/Timestamp' }
    CareTask:
      type: object
      required: [task_id, participant_ref, assignee, task_type, due_by_utc, status, completed_at_utc, facility_label]
      additionalProperties: false
      properties:
        task_id: { type: string, pattern: '^task_[a-f0-9]{32}$' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        assignee: { type: string, enum: [ASHA_WORKER, FACILITY] }
        task_type: { type: string, enum: [HOME_VISIT, CHECK_IN_CALL, ACCOMPANY_TO_FACILITY, TREATMENT_ADHERENCE_CHECK] }
        due_by_utc: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [OPEN, DONE, NOT_REACHABLE, DECLINED, CANCELLED] }
        completed_at_utc: { type: [string, 'null'], format: date-time }
        facility_label: { type: string }
    CarePlan:
      type: object
      required: [plan_id, next_contact_at_utc, next_contact_mode, referral_target, tasks]
      additionalProperties: false
      properties:
        plan_id: { type: string, pattern: '^plan_[a-f0-9]{32}$' }
        next_contact_at_utc: { type: [string, 'null'], format: date-time }
        next_contact_mode: { type: [string, 'null'], enum: [IN_PERSON, PHONE, VIDEO, HOME_VISIT, null] }
        referral_target: { type: string, enum: [NONE, PSYCHIATRY_OPD, DISTRICT_MENTAL_HEALTH_PROGRAMME, TELE_MANAS, COUNSELLING, EMERGENCY_SERVICES] }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/CareTask' }
    EncounterClose:
      type: object
      required: [ended_at_utc]
      additionalProperties: false
      properties:
        ended_at_utc: { $ref: '#/components/schemas/Timestamp' }
    TaskCompletion:
      type: object
      required: [completed_at_utc, outcome]
      additionalProperties: false
      properties:
        completed_at_utc: { $ref: '#/components/schemas/Timestamp' }
        outcome: { type: string, enum: [DONE, NOT_REACHABLE, DECLINED] }
    TaskList:
      type: object
      required: [tasks]
      additionalProperties: false
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/CareTask' }
    Encounter:
      type: object
      required: [encounter_id, participant_ref, facility_code, facility_label, encounter_type, series_id, care_role, recorded_by_ref,
                 data_origin, started_at_utc, ended_at_utc, urgent_review_flag, clinical_notes_enabled, instruments, notes,
                 clinician_diagnoses, care_plan]
      additionalProperties: false
      properties:
        encounter_id: { type: string, pattern: '^enc_[a-f0-9]{32}$' }
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        facility_code: { type: string }
        facility_label: { type: string }
        encounter_type: { type: string, enum: [IN_PERSON, TELE_PHONE, TELE_VIDEO, COUNSELLING_SESSION] }
        series_id: { type: [string, 'null'] }
        care_role: { $ref: '#/components/schemas/CareRole' }
        recorded_by_ref: { type: string, pattern: '^clin_[a-f0-9]{32}$' }
        data_origin: { type: string, enum: [SYNTHETIC, PARTICIPANT] }
        started_at_utc: { $ref: '#/components/schemas/Timestamp' }
        ended_at_utc: { type: [string, 'null'], format: date-time }
        urgent_review_flag: { type: boolean }
        clinical_notes_enabled: { type: boolean }
        instruments:
          type: array
          items: { $ref: '#/components/schemas/InstrumentResult' }
        notes:
          type: array
          description: Only for CLINICIAN or COUNSELLOR working at the encounter's facility, while notes are enabled.
          items:
            type: object
            required: [note_id, text, author_ref, created_at_utc]
            additionalProperties: false
            properties:
              note_id: { type: string }
              text: { type: string }
              author_ref: { type: string, pattern: '^clin_[a-f0-9]{32}$' }
              created_at_utc: { $ref: '#/components/schemas/Timestamp' }
        clinician_diagnoses:
          type: array
          items: { $ref: '#/components/schemas/Diagnosis' }
        care_plan:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CarePlan'
    Timeline:
      type: object
      required: [participant_ref, items]
      additionalProperties: false
      properties:
        participant_ref: { $ref: '#/components/schemas/ParticipantRef' }
        items:
          type: array
          items:
            type: object
            required: [kind, reference, at, summary_code, urgent_review_flag, facility_label]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [ASHA_VISIT, ENCOUNTER] }
              reference: { type: string }
              at: { $ref: '#/components/schemas/Timestamp' }
              summary_code: { type: string, description: 'Coded summary, for example "TELE_PHONE PHQ-9=MODERATE" (bands for clinical roles only).' }
              urgent_review_flag: { type: boolean }
              facility_label: { type: [string, 'null'] }

    Problem:
      type: object
      description: RFC 9457 problem details. `detail` is a fixed, non-identifying message. `errors` gives field paths and rules, never values.
      required: [type, title, status, code, correlation_id]
      additionalProperties: false
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - IDEMPOTENCY_CONFLICT
            - RESOURCE_CONFLICT
            - CONSENT_NOT_ACTIVE
            - CONSENT_PARTICIPANT_MISMATCH
            - CONSENT_SCOPE_INCOMPLETE
            - ADULT_CONFIRMATION_REQUIRED
            - DATA_ORIGIN_NOT_PERMITTED
            - CHECKSUM_MISMATCH
            - RECORDING_NOT_UPLOADED
            - PARTNER_NOT_ENABLED
            - CLINICAL_NOTES_DISABLED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - INTERNAL_ERROR
        detail: { type: string, maxLength: 300 }
        correlation_id: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [pointer, rule]
            additionalProperties: false
            properties:
              pointer: { type: string, description: JSON Pointer to the offending field. }
              rule: { type: string }

  examples:
    ConsentEventCreateExample:
      summary: Synthetic Kannada consent, research reuse granted, model training declined
      value:
        consent_event_id: ce_00000000000000000000000000000001
        participant_ref: ppt_00000000000000000000000000000001
        consent_form: { form_id: screening-consent, form_version: 0.1.0, language_tag: kn-IN }
        scope_decisions:
          - { scope: SCREENING_PARTICIPATION, granted: true }
          - { scope: AUDIO_RECORDING, granted: true }
          - { scope: AUDIO_RETENTION, granted: false }
          - { scope: RESEARCH_FEATURE_REUSE, granted: true }
          - { scope: MODEL_TRAINING, granted: false }
          - { scope: QUALITY_REVIEW, granted: false }
        capture:
          captured_at_utc: '2026-10-17T09:05:00Z'
          method: SIGNED_ON_DEVICE
          read_aloud: true
          comprehension_confirmed: true
          witness_present: false
        safeguards: { adult_confirmed: true, assisted_consent: false }
    ConsentEventExample:
      value:
        consent_event_id: ce_00000000000000000000000000000001
        participant_ref: ppt_00000000000000000000000000000001
        consent_form: { form_id: screening-consent, form_version: 0.1.0, language_tag: kn-IN }
