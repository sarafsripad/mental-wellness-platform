spring.application.name=wellness-api

# --- Database (app_db; identity_db is configured separately below) ------------
# No default password: set WELLNESS_DB_PASSWORD (run-local.sh reads deploy/local/.env).
spring.datasource.url=${WELLNESS_DB_URL:jdbc:postgresql://localhost:5433/app_db}
spring.datasource.username=${WELLNESS_DB_USER:app_user}
spring.datasource.password=${WELLNESS_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
# Local runs and tests add classpath:db/local-seed (synthetic consent form IDs); never in production.

# --- Identity database (identity module, web application only; ADR-010, ADR-013) ---
# A separate database and role. No defaults: run-local.sh reads deploy/local/.env.
wellness.identity.url=${WELLNESS_IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity_db}
wellness.identity.username=${WELLNESS_IDENTITY_DB_USER:identity_user}
wellness.identity.password=${WELLNESS_IDENTITY_DB_PASSWORD:}
# AES-256 field-encryption key, 64 hex characters (WELLNESS_IDENTITY_KEY); no default.
wellness.identity.key=${WELLNESS_IDENTITY_KEY:}
# HMAC key for the blind search index (exact name+village match), 64 hex characters; no default.
wellness.identity.index-key=${WELLNESS_IDENTITY_INDEX_KEY:}

# --- Programme support contacts (ADR-015) -------------------------------------
# Shown with urgent-review alerts. The clinical lead must verify each contact for the programme
# area (consent-and-data-lifecycle.md section 13); until then verified-by stays PENDING_CLINICAL_LEAD.
wellness.programme.support-contacts[0].id=tele-manas
wellness.programme.support-contacts[0].name=Tele-MANAS (National Tele Mental Health Programme)
wellness.programme.support-contacts[0].phone=14416
wellness.programme.support-contacts[0].hours=24x7
wellness.programme.support-contacts[0].coverage=NATIONAL
wellness.programme.support-contacts[0].verified-by=PENDING_CLINICAL_LEAD
wellness.programme.support-contacts[1].id=tele-manas-tollfree
wellness.programme.support-contacts[1].name=Tele-MANAS toll-free
wellness.programme.support-contacts[1].phone=1-800-891-4416
wellness.programme.support-contacts[1].hours=24x7
wellness.programme.support-contacts[1].coverage=NATIONAL
wellness.programme.support-contacts[1].verified-by=PENDING_CLINICAL_LEAD

# --- Partner programmes (ADR-015) ---------------------------------------------
# Only SIMULATED partners on this machine exist. REAL partners are refused at startup until a signed
# data-sharing agreement, a named approver and an environment approved for participant data exist
# (docs/integration/partner-onboarding.md). Every partner and the dispatcher are off by default;
# run-local.sh turns them on against deploy/local/partner-simulator.
wellness.integration.dispatch.enabled=${WELLNESS_INTEGRATION_DISPATCH_ENABLED:false}
wellness.integration.partners[0].id=sim-tele-manas
wellness.integration.partners[0].display-name=Tele-MANAS (SIMULATED)
wellness.integration.partners[0].kind=TELE_MANAS
wellness.integration.partners[0].mode=SIMULATED
wellness.integration.partners[0].enabled=${WELLNESS_PARTNER_SIM_TELE_MANAS_ENABLED:${WELLNESS_PARTNER_SIM_ENABLED:false}}
wellness.integration.partners[0].endpoint=${WELLNESS_PARTNER_SIM_URL:http://127.0.0.1:8090}/tele-manas
wellness.integration.partners[0].client-id=partner-simulator
wellness.integration.partners[0].signing-secret=${WELLNESS_PARTNER_SIM_SIGNING_SECRET:}
wellness.integration.partners[1].id=sim-esanjeevani
wellness.integration.partners[1].display-name=eSanjeevani teleconsultation (SIMULATED)
wellness.integration.partners[1].kind=ESANJEEVANI
wellness.integration.partners[1].mode=SIMULATED
wellness.integration.partners[1].enabled=${WELLNESS_PARTNER_SIM_ESANJEEVANI_ENABLED:${WELLNESS_PARTNER_SIM_ENABLED:false}}
wellness.integration.partners[1].endpoint=${WELLNESS_PARTNER_SIM_URL:http://127.0.0.1:8090}/esanjeevani
wellness.integration.partners[1].client-id=partner-simulator
wellness.integration.partners[1].signing-secret=${WELLNESS_PARTNER_SIM_SIGNING_SECRET:}
wellness.integration.partners[2].id=sim-state-hmis
wellness.integration.partners[2].display-name=State HMIS reporting (SIMULATED)
wellness.integration.partners[2].kind=HMIS
wellness.integration.partners[2].mode=SIMULATED
wellness.integration.partners[2].enabled=${WELLNESS_PARTNER_SIM_HMIS_ENABLED:${WELLNESS_PARTNER_SIM_ENABLED:false}}
wellness.integration.partners[2].endpoint=${WELLNESS_PARTNER_SIM_URL:http://127.0.0.1:8090}/hmis
wellness.integration.partners[2].client-id=partner-simulator
wellness.integration.partners[2].signing-secret=${WELLNESS_PARTNER_SIM_SIGNING_SECRET:}

# --- HMIS aggregate report (ADR-015): human-triggered only, via run-hmis-report.sh -----
wellness.hmis.run-once=${WELLNESS_HMIS_RUN_ONCE:false}
wellness.hmis.dir=${WELLNESS_HMIS_DIR:build/hmis-reports}
wellness.hmis.month=${WELLNESS_HMIS_MONTH:}
# Post the report to the (SIMULATED) HMIS partner; off by default, the file is always written.
wellness.hmis.deliver=${WELLNESS_HMIS_DELIVER:false}

# --- Clinical notes (ADR-016): free text, off until a sensitive-text policy is approved ---
wellness.clinical-notes.enabled=${WELLNESS_CLINICAL_NOTES_ENABLED:false}
# AES-256 key for notes, 64 hex characters; required only when notes are enabled.
wellness.clinical-notes.key=${WELLNESS_NOTES_KEY:}

# --- Bearer tokens (local Keycloak realm by default) --------------------------
wellness.security.jwt.issuer=${WELLNESS_JWT_ISSUER:http://localhost:8081/realms/wellness-local}
wellness.security.jwt.jwk-set-uri=${WELLNESS_JWT_JWK_SET_URI:http://localhost:8081/realms/wellness-local/protocol/openid-connect/certs}
wellness.security.jwt.audience=wellness-api

# --- Pseudonyms (wkr_ worker references): HMAC key, no default ----------------
wellness.pseudonyms.key=${WELLNESS_PSEUDONYM_KEY:}

# --- Audio storage (S3-compatible; local SeaweedFS by default) -----------------
# Credentials have no defaults: run-local.sh reads them from deploy/local/.env.
wellness.storage.endpoint=${WELLNESS_STORAGE_ENDPOINT:http://localhost:8333}
wellness.storage.region=${WELLNESS_STORAGE_REGION:us-east-1}
wellness.storage.bucket=${WELLNESS_STORAGE_BUCKET:wellness-audio}
wellness.storage.access-key=${WELLNESS_STORAGE_ACCESS_KEY:}
wellness.storage.secret-key=${WELLNESS_STORAGE_SECRET_KEY:}

# --- Data origins this environment accepts -------------------------------------
# No environment is approved for real participant data (consent-and-data-lifecycle.md section 14).
wellness.data.allowed-origins=SYNTHETIC,AUTHORIZED_TEST_AUDIO

# --- Research export (S8): human-triggered only, via run-export.sh ------------
wellness.export.dir=${WELLNESS_EXPORT_DIR:}
wellness.export.key=${WELLNESS_EXPORT_KEY:}
wellness.export.run-once=${WELLNESS_EXPORT_RUN_ONCE:false}

# --- Local test console (S-dev): off unless run-local.sh enables it -----------
wellness.dev-console.enabled=${WELLNESS_DEV_CONSOLE_ENABLED:false}

# --- ASHA Care web app (ADR-013): off unless run-local.sh enables it ----------
wellness.asha-app.enabled=${WELLNESS_ASHA_APP_ENABLED:false}

# --- Clinician review dashboard (ADR-014): off unless run-local.sh enables it -
wellness.review-app.enabled=${WELLNESS_REVIEW_APP_ENABLED:false}

# --- Clinic app (ADR-016): off unless run-local.sh enables it -----------------
wellness.clinic-app.enabled=${WELLNESS_CLINIC_APP_ENABLED:false}

# --- JSON: reject unknown fields (contracts use additionalProperties: false) ---
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true

# --- Actuator: health only, status only ---------------------------------------
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
# No /actuator discovery page listing the exposed endpoints.
management.endpoints.web.discovery.enabled=false

# --- Errors: never expose internals --------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.servlet.session.tracking-modes=

# --- Logging: structured JSON with the correlation ID from the MDC ------------
# Never log request bodies, audio, names or feature values.
logging.structured.format.console=ecs
# The contracts use documentation keywords (version, x-changelog, x-governance) on purpose.
logging.level.com.networknt.schema=ERROR
