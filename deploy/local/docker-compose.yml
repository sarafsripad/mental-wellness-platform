# Local development environment — slice step S2.
# See deploy/local/README.md. Synthetic and authorised test data only.
#
# Secrets come from deploy/local/.env (generated by init-env.sh, gitignored).
# Start with ./up.sh, which refuses to run if any required value is missing.
# (Plain ${VAR} is used because some Compose versions mis-parse ${VAR:?message}.)
# All published ports bind to 127.0.0.1 only.
#
# The wellness-api (S3) and audio-processing-worker (S7) services are added in
# later steps. They will join these networks:
#   wellness-api:            data, auth, worker
#   audio-processing-worker: worker only (no database or storage access, ADR-007)

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Require passwords for every connection, including inside the container
      # (the image default trusts local socket and loopback connections).
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db && pg_isready -U postgres -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  # S3-compatible object storage for raw audio (ADR-005). SeaweedFS replaces
  # MinIO for local development: MinIO no longer publishes freely pullable images.
  storage:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "/init/start-storage.sh"]
    environment:
      STORAGE_ROOT_ACCESS_KEY: ${STORAGE_ROOT_ACCESS_KEY}
      STORAGE_ROOT_SECRET_KEY: ${STORAGE_ROOT_SECRET_KEY}
      STORAGE_APP_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY}
      STORAGE_APP_SECRET_KEY: ${STORAGE_APP_SECRET_KEY}
      AUDIO_BUCKET: wellness-audio
      # SSE-S3 key material (local only; production uses a managed KMS).
      WEED_S3_SSE_KEY: ${STORAGE_SSE_KEY}
      WEED_S3_SSE_KEK_PASSPHRASE: ${STORAGE_SSE_KEK_PASSPHRASE}
      WEED_JWT_FILER_SIGNING_KEY: ${STORAGE_JWT_SIGNING_KEY}
    volumes:
      - ./storage:/init:ro
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider -q http://localhost:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [data]

  # One-shot: creates the audio bucket with default SSE-S3 encryption and a
  # lifecycle expiry rule. Idempotent.
  storage-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ROOT_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_ROOT_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://storage:8333
      AUDIO_BUCKET: wellness-audio
      AUDIO_EXPIRY_DAYS: "30"
    volumes:
      - ./storage:/init:ro
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    restart: "no"
    networks: [data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Tokens carry issuer http://localhost:8081 (what the app and host see);
      # containers may still reach Keycloak at http://keycloak:8081.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Substituted into the realm import file.
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD}
      PROCESSING_WORKER_CLIENT_SECRET: ${PROCESSING_WORKER_CLIENT_SECRET}
      E2E_CLIENT_SECRET: ${E2E_CLIENT_SECRET}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [auth]

networks:
  data: {}
  auth: {}
  worker: {}

volumes:
  postgres-data: {}
  storage-data: {}
