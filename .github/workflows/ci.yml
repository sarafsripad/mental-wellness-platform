name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so the secret scan can diff against the base commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Secret scan (changes in this push or pull request)
        env:
          # PR: scan everything since the base branch. Push: scan since the previous tip.
          # A brand-new branch has an all-zero "before", so fall back to the first commit.
          SCAN_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$SCAN_BASE" ] || [ "$SCAN_BASE" = "0000000000000000000000000000000000000000" ]; then
            SCAN_BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          export SCAN_BASE
          bash scripts/check-secrets.sh

      - name: Contract validation
        run: bash scripts/validate-contracts.sh

      - name: Example and OpenAPI validation
        run: python scripts/validate-examples.py

      - name: Contract test suite
        run: python -m pytest tests/contracts -q

      - name: Research pipeline (Workstream B) tests
        run: python -m pytest workstream-b/research-pipeline/tests -q

      - name: Lint (advisory)
        run: bash scripts/lint-check.sh

  backend:
    name: Backend (wellness-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workstream-a/backend/wellness-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper checksum is pinned
        run: grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties

      # Unit, contract, module-boundary, architecture and Testcontainers integration tests.
      - name: Test
        run: ./gradlew --no-daemon test

      # Real requests and responses recorded by the integration tests, checked against the
      # OpenAPI schemas with the same validator as the contract examples.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate recorded API traffic against the contract
        working-directory: .
        run: |
          python -m pip install -r requirements-dev.txt
          test -n "$(ls workstream-a/backend/wellness-api/build/contract-samples/*.json 2>/dev/null)"
          python -m pytest tests/contracts/test_backend_samples.py -q
          # Exports written by the Java producer must pass the Workstream B consumer unchanged.
          python -m pytest workstream-b/research-pipeline/tests -q

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wellness-api-test-reports
          path: workstream-a/backend/wellness-api/build/reports/tests/

  worker:
    name: Processing worker (Python + openSMILE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests run inside the same pinned image the worker is deployed in.
      - name: Build test image
        run: docker build --target test -f workstream-a/processing-worker/Dockerfile -t wellness-worker-test .
      - name: Test
        run: docker run --rm wellness-worker-test

  e2e:
    name: End-to-end vertical slice (S10)
    runs-on: ubuntu-latest
    needs: [backend, worker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Start local stack (Postgres, storage, Keycloak) with generated secrets
        working-directory: deploy/local
        run: |
          ./init-env.sh
          ./up.sh
          for i in $(seq 1 60); do
            [ "$(docker compose ps | grep -c '(healthy)')" -ge 3 ] && break; sleep 5
          done
          ./verify.sh

      - name: Start the API
        working-directory: workstream-a/backend/wellness-api
        run: |
          nohup ./run-local.sh > build-bootrun.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 3; done
          mkdir -p build && cp build-bootrun.log build/bootrun.log

      - name: Start the worker
        working-directory: workstream-a/processing-worker
        env:
          # Keycloak's port is bound to 127.0.0.1, so reach it on the stack network instead.
          WORKER_NETWORK: wellness-local_auth
          WORKER_TOKEN_URL: http://keycloak:8081/realms/wellness-local/protocol/openid-connect/token
        run: |
          nohup ./run-local.sh > .worker.log 2>&1 &
          for i in $(seq 1 120); do grep -q "processing-jobs/claim" .worker.log && break; sleep 5; done

      - name: End-to-end tests (fail, never skip)
        env:
          E2E_REQUIRED: "1"
        run: |
          cp workstream-a/backend/wellness-api/build-bootrun.log workstream-a/backend/wellness-api/build/bootrun.log
          python -m pytest tests/e2e -q

      - name: Collect logs on failure
        if: failure()
        run: |
          tail -n 200 workstream-a/backend/wellness-api/build-bootrun.log || true
          tail -n 200 workstream-a/processing-worker/.worker.log || true
          (cd deploy/local && docker compose ps && docker compose logs --tail 100) || true
